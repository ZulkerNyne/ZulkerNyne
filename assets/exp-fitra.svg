<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370">
  <defs>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#00000018"/></filter>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="900" height="32"><line x1="0" y1="31" x2="900" y2="31" stroke="#c8daf0" stroke-width="1" opacity="0.4"/></pattern>
  </defs>
  <rect width="900" height="370" fill="#FFF9E8"/>
  <rect width="900" height="370" fill="url(#lines)"/>
  <line x1="80" y1="0" x2="80" y2="370" stroke="#f4a0a0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="40" cy="50" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="130" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="210" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="290" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="365" r="7" fill="none" stroke="#999" stroke-width="1.3"/>

  <!-- Title -->
  <text x="100" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#222" font-weight="bold" filter="url(#rough)">Backend Developer</text>
  <text x="340" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#888">· FITRA Gym</text>
  <text x="100" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#888">Oct 2026 → Present · fitragym.ca</text>

  <!-- Description -->
  <text x="100" y="82" font-family="Georgia, serif" font-size="13" fill="#444">Building the <tspan font-weight="bold">production backend</tspan> for a women's fitness centre booking system —</text>
  <text x="100" y="99" font-family="Georgia, serif" font-size="13" fill="#444">Express + Prisma + PostgreSQL, replacing a 3,648-line localStorage prototype with a real</text>
  <text x="100" y="116" font-family="Georgia, serif" font-size="13" fill="#444">server. Two portals (Community &amp; School), four roles, 13 Prisma models.</text>

  <!-- Bullets -->
  <text x="110" y="145" font-family="Georgia, serif" font-size="12.5" fill="#555">— <tspan font-weight="bold" fill="#333">Credit ledger</tspan> via SUM-delta pattern — no running balance to desync,</text>
  <text x="122" y="161" font-family="Georgia, serif" font-size="12.5" fill="#555">atomic capacity enforcement</text>

  <text x="110" y="183" font-family="Georgia, serif" font-size="12.5" fill="#555">— <tspan font-weight="bold" fill="#333">Waitlist offer chain</tspan> with 60-min reserve window, 4-day refund cutoff,</text>
  <text x="122" y="199" font-family="Georgia, serif" font-size="12.5" fill="#555">FTR-XXXXX booking refs</text>

  <text x="110" y="221" font-family="Georgia, serif" font-size="12.5" fill="#555">— <tspan font-weight="bold" fill="#333">Stripe Checkout</tspan> integration for drop-ins, memberships, and credit packs —</text>
  <text x="122" y="237" font-family="Georgia, serif" font-size="12.5" fill="#555">all money in integer cents CAD</text>

  <text x="110" y="259" font-family="Georgia, serif" font-size="12.5" fill="#555">— JWT sessions via HttpOnly cookies, bcrypt 12-round hashing, Resend email,</text>
  <text x="122" y="275" font-family="Georgia, serif" font-size="12.5" fill="#555">audit log on all admin actions</text>

  <text x="110" y="297" font-family="Georgia, serif" font-size="12.5" fill="#888" font-style="italic">★ one Express server hosts both the wave2 marketing site and the booking app at /app</text>

  <!-- Tech tags -->
  <g transform="translate(100, 314)" filter="url(#shadow)">
    <rect width="68" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="34" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Express</text>
  </g>
  <g transform="translate(178, 314)" filter="url(#shadow)">
    <rect width="58" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="29" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Prisma</text>
  </g>
  <g transform="translate(246, 314)" filter="url(#shadow)">
    <rect width="86" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="43" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">PostgreSQL</text>
  </g>
  <g transform="translate(342, 314)" filter="url(#shadow)">
    <rect width="56" height="22" rx="3" fill="#E1BEE7" opacity="0.8"/><text x="28" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Stripe</text>
  </g>
  <g transform="translate(408, 314)" filter="url(#shadow)">
    <rect width="72" height="22" rx="3" fill="#FFE0B2" opacity="0.8"/><text x="36" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">JWT Auth</text>
  </g>
  <g transform="translate(490, 314)" filter="url(#shadow)">
    <rect width="62" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="31" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Resend</text>
  </g>

  <path d="M100,352 Q300,357 500,350 Q700,357 860,352" fill="none" stroke="#e0d5b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>