<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370">
  <defs>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#00000018"/></filter>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="900" height="32"><line x1="0" y1="31" x2="900" y2="31" stroke="#c8daf0" stroke-width="1" opacity="0.4"/></pattern>
  </defs>
  <rect width="900" height="370" fill="#FFF9E8"/>
  <rect width="900" height="370" fill="url(#lines)"/>
  <line x1="80" y1="0" x2="80" y2="370" stroke="#f4a0a0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="40" cy="50" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="130" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="210" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="290" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="365" r="7" fill="none" stroke="#999" stroke-width="1.3"/>

  <text x="100" y="35" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="22" fill="#222" font-weight="bold" filter="url(#rough)">Backend Developer</text>
  <text x="340" y="35" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="22" fill="#888">· CycleBreaker</text>
  <text x="100" y="55" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="12" fill="#888">Jan 2026 → Apr 2026 · cyclebreaker.net · Education Platform</text>

  <text x="100" y="82" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444">Built the Express + Prisma + PostgreSQL backend for a <tspan font-weight="bold">science-based addiction</tspan></text>
  <text x="100" y="99" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444"><tspan font-weight="bold">recovery education platform</tspan> serving youth. JWT auth with silent refresh,</text>
  <text x="100" y="116" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444">role-based access, full admin CMS, and a <tspan font-weight="bold">rule-based risk prediction engine</tspan>.</text>

  <text x="110" y="145" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Recovery tools: private journal with mood/craving/stress tracking, HALT indicators,</text>
  <text x="122" y="161" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">daily check-ins, recovery event logging</text>

  <text x="110" y="183" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— <tspan font-weight="bold" fill="#333">Rule-based risk prediction</tspan> — 7-day and 30-day trend aggregation, trigger</text>
  <text x="122" y="199" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">frequency, risk scoring with suggested actions</text>

  <text x="110" y="221" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Full admin CMS: articles, courses with multi-lesson paths, videos, quizzes with</text>
  <text x="122" y="237" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">scoring, resources, and 36-field homepage editor</text>

  <text x="110" y="259" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Email system: welcome, password reset, weekly recovery digest</text>
  <text x="122" y="275" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">(personalized stats + new content), account deletion confirmation</text>

  <text x="110" y="297" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#888" font-style="italic">★ deployed on Railway (backend) + Netlify (frontend) — live at cyclebreaker.net</text>

  <g transform="translate(100, 314)" filter="url(#shadow)">
    <rect width="68" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="34" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Express</text>
  </g>
  <g transform="translate(178, 314)" filter="url(#shadow)">
    <rect width="58" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="29" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Prisma</text>
  </g>
  <g transform="translate(246, 314)" filter="url(#shadow)">
    <rect width="86" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="43" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">PostgreSQL</text>
  </g>
  <g transform="translate(342, 314)" filter="url(#shadow)">
    <rect width="72" height="22" rx="3" fill="#FFE0B2" opacity="0.8"/><text x="36" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">JWT Auth</text>
  </g>
  <g transform="translate(424, 314)" filter="url(#shadow)">
    <rect width="46" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="23" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Zod</text>
  </g>
  <g transform="translate(480, 314)" filter="url(#shadow)">
    <rect width="66" height="22" rx="3" fill="#E1BEE7" opacity="0.8"/><text x="33" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Railway</text>
  </g>

  <path d="M100,352 Q300,357 500,350 Q700,357 860,352" fill="none" stroke="#e0d5b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>