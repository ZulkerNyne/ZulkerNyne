<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370">
  <defs>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#00000018"/></filter>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="900" height="32"><line x1="0" y1="31" x2="900" y2="31" stroke="#c8daf0" stroke-width="1" opacity="0.4"/></pattern>
  </defs>
  <rect width="900" height="370" fill="#FFF9E8"/>
  <rect width="900" height="370" fill="url(#lines)"/>
  <line x1="80" y1="0" x2="80" y2="370" stroke="#f4a0a0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="40" cy="50" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="130" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="210" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="290" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="365" r="7" fill="none" stroke="#999" stroke-width="1.3"/>

  <text x="100" y="35" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="22" fill="#222" font-weight="bold" filter="url(#rough)">Software Developer</text>
  <text x="350" y="35" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="22" fill="#888">· Khutba</text>
  <text x="100" y="55" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="12" fill="#888">May 2026 → Sep 2026 · khutba.net · SaaS Product</text>

  <text x="100" y="82" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444">Built a <tspan font-weight="bold">SaaS sermon planning platform</tspan> for mosque imams. Next.js + Prisma +</text>
  <text x="100" y="99" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444">PostgreSQL with session-based auth, role-based access, mosque invitations, and</text>
  <text x="100" y="116" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="13" fill="#444"><tspan font-weight="bold">18 API route groups</tspan> covering sermons, themes, org management, admin, billing, and export.</text>

  <text x="110" y="145" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Designed the <tspan font-weight="bold" fill="#333">4-season × 16-slot annual plan model</tspan> with elastic sub-bouquets —</text>
  <text x="122" y="161" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">structurally coherent yet flexible per imam's needs</text>

  <text x="110" y="183" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— <tspan font-weight="bold" fill="#333">Hijri occasion interleaving</tspan>: Eid, Ramadan, and special sermons auto-placed</text>
  <text x="122" y="199" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">by date into the correct seasonal block</text>

  <text x="110" y="221" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Cross-season spillover, dual-delivery Eid stacking, moon-sighting ±1 day tolerance</text>

  <text x="110" y="243" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Mosque invite system, multi-imam collaboration, Stripe subscription billing</text>
  <text x="122" y="259" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">(Personal / Team / Institution tiers)</text>

  <text x="110" y="281" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#888" font-style="italic">★ designed the entire annual-plan data model from scratch — 64-slot elastic architecture</text>

  <g transform="translate(100, 300)" filter="url(#shadow)">
    <rect width="62" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="31" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Next.js</text>
  </g>
  <g transform="translate(172, 300)" filter="url(#shadow)">
    <rect width="58" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="29" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Prisma</text>
  </g>
  <g transform="translate(240, 300)" filter="url(#shadow)">
    <rect width="86" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="43" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">PostgreSQL</text>
  </g>
  <g transform="translate(336, 300)" filter="url(#shadow)">
    <rect width="56" height="22" rx="3" fill="#E1BEE7" opacity="0.8"/><text x="28" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Stripe</text>
  </g>
  <g transform="translate(402, 300)" filter="url(#shadow)">
    <rect width="62" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="31" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Resend</text>
  </g>
  <g transform="translate(474, 300)" filter="url(#shadow)">
    <rect width="86" height="22" rx="3" fill="#FFE0B2" opacity="0.8"/><text x="43" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">TypeScript</text>
  </g>

  <path d="M100,352 Q300,357 500,350 Q700,357 860,352" fill="none" stroke="#e0d5b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>