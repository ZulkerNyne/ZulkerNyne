<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#00000018"/></filter>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="900" height="32"><line x1="0" y1="31" x2="900" y2="31" stroke="#c8daf0" stroke-width="1" opacity="0.4"/></pattern>
  </defs>
  <rect width="900" height="380" fill="#FFF9E8"/>
  <rect width="900" height="380" fill="url(#lines)"/>
  <line x1="80" y1="0" x2="80" y2="380" stroke="#f4a0a0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="40" cy="50" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="130" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="210" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="290" r="7" fill="none" stroke="#999" stroke-width="1.3"/>
  <circle cx="40" cy="370" r="7" fill="none" stroke="#999" stroke-width="1.3"/>

  <!-- Submarine doodle -->
  <g transform="translate(720, 15) scale(0.5)">
    <ellipse cx="100" cy="50" rx="90" ry="35" fill="#5C6BC0" opacity="0.7" filter="url(#rough)"/>
    <rect x="60" y="20" width="30" height="30" rx="5" fill="#7986CB" opacity="0.8"/>
    <line x1="75" y1="20" x2="75" y2="5" stroke="#999" stroke-width="2"/>
    <circle cx="75" cy="3" r="3" fill="#EF5350"/>
    <circle cx="50" cy="55" r="6" fill="#BBDEFB" opacity="0.8"/>
    <circle cx="100" cy="55" r="6" fill="#BBDEFB" opacity="0.8"/>
    <circle cx="150" cy="55" r="6" fill="#BBDEFB" opacity="0.8"/>
    <path d="M10,50 Q5,48 10,46" fill="none" stroke="#90CAF9" stroke-width="1.5"/>
    <path d="M5,55 Q0,53 5,51" fill="none" stroke="#90CAF9" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="100" y="35" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="22" fill="#222" font-weight="bold" filter="url(#rough)">Software Lead</text>
  <text x="100" y="55" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="12" fill="#888">Sept 2025 → Present · auvucalgary.ca · University of Calgary</text>

  <!-- Description -->
  <text x="100" y="82" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="13" fill="#444">Leading the software sub-team for a <tspan font-weight="bold" text-decoration="underline">founding-year</tspan></text>
  <text x="100" y="99" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="13" fill="#444"><tspan font-weight="bold">autonomous underwater vehicle team</tspan>, building everything from scratch toward</text>
  <text x="100" y="116" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="13" fill="#444">our first RoboSub 2027 competition entry. Designed the ROS2 architecture,</text>
  <text x="100" y="133" font-family="'Segoe Script', 'Comic Sans MS', 'Bradley Hand', cursive" font-size="13" fill="#444">set up the Gazebo simulation environment, and shipped the team's public website.</text>

  <!-- Bullets -->
  <text x="110" y="162" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Designed the <tspan font-weight="bold" fill="#333">ROS2 node architecture</tspan> — auv_control (thrust),</text>
  <text x="122" y="178" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">perception_mock (object markers), camera bridging, and TF tree</text>

  <text x="110" y="200" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Built the <tspan font-weight="bold" fill="#333">Gazebo simulation environment</tspan> with custom Tethys AUV model,</text>
  <text x="122" y="216" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">RoboSub 2025 world, forward + downward cameras, and RViz integration</text>

  <text x="110" y="238" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Shipped the <tspan font-weight="bold" fill="#333">team website</tspan> — React + Vite SPA with team profiles, vehicle page,</text>
  <text x="122" y="254" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">blog, docs, media gallery, sponsors, and judges hub</text>

  <text x="110" y="276" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#555">— Leading a 5-person software sub-team across simulation, perception, and controls</text>

  <text x="110" y="298" font-family="'Comic Sans MS', 'Segoe Script', 'Bradley Hand', cursive" font-size="12.5" fill="#888" font-style="italic">★ founding team — built all software architecture decisions from zero, no handoff</text>

  <!-- Tech tags -->
  <g transform="translate(100, 318)" filter="url(#shadow)">
    <rect width="62" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="31" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Python</text>
  </g>
  <g transform="translate(172, 318)" filter="url(#shadow)">
    <rect width="52" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="26" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">ROS2</text>
  </g>
  <g transform="translate(234, 318)" filter="url(#shadow)">
    <rect width="66" height="22" rx="3" fill="#FFEB3B" opacity="0.8"/><text x="33" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Gazebo</text>
  </g>
  <g transform="translate(310, 318)" filter="url(#shadow)">
    <rect width="56" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="28" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">React</text>
  </g>
  <g transform="translate(376, 318)" filter="url(#shadow)">
    <rect width="46" height="22" rx="3" fill="#B3E5FC" opacity="0.8"/><text x="23" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Vite</text>
  </g>
  <g transform="translate(432, 318)" filter="url(#shadow)">
    <rect width="82" height="22" rx="3" fill="#C8E6C9" opacity="0.8"/><text x="41" y="15" font-family="'Comic Sans MS', 'Bradley Hand', cursive" font-size="10" fill="#333" text-anchor="middle">Cloudinary</text>
  </g>

  <!-- Bottom divider -->
  <path d="M100,360 Q300,365 500,358 Q700,365 860,360" fill="none" stroke="#e0d5b8" stroke-width="1.5" stroke-linecap="round"/>
</svg>