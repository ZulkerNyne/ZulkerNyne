  <defs>
    <filter id="rough">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="900" height="100" fill="#FFF9E8" rx="4"/>
  <path d="M20,15 Q200,12 400,18 Q600,12 880,15" fill="none" stroke="#e0d5b8" stroke-width="1" stroke-linecap="round"/>
  <text x="450" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#666" text-anchor="middle" filter="url(#rough)">ZulkerNyne</text>
  <text x="450" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#999" text-anchor="middle" font-style="italic">drawn with ❤️ in Calgary 🇨🇦 · P vs NP? Just doodle it.</text>
  <text x="450" y="92" font-family="'Segoe UI', sans-serif" font-size="11" fill="#bbb" text-anchor="middle">© 2026 Zulkernyne</text>
